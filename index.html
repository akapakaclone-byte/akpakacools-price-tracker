<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akapakacools Price Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .chart-box {
            background: #141419;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        canvas {
            width: 100% !important;
            height: 500px !important;
        }
    </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>

<div class="container">

    <h1>Skellies</h1>

    <div class="subtitle">
        Price history
    </div>

    <div class="chart-box">
        <canvas id="priceChart"></canvas>
    </div>

</div>

<script>

async function loadPrices() {

    const skelliesResponse = await fetch("/prices/Skellies");
    const spawnersResponse = await fetch("/prices/Skeleton%20Spawners");

    const skellies = await skelliesResponse.json();
    const spawners = await spawnersResponse.json();

    const labels = [
        ...new Set([
            ...skellies.map(item => item.timestamp),
            ...spawners.map(item => item.timestamp)
        ])
    ].sort();

    const skelliesMap = {};
    skellies.forEach(item => {
        skelliesMap[item.timestamp] = item.price;
    });

    const spawnersMap = {};
    spawners.forEach(item => {
        spawnersMap[item.timestamp] = item.price;
    });

    const formattedLabels = labels.map(function(timestamp) {
        const date = new Date(item.timestamp);

return String(date.getDate()).padStart(2, "0") + "/" +
       String(date.getMonth() + 1).padStart(2, "0") + "/" +
       date.getFullYear() + " " +
       String(date.getHours()).padStart(2, "0") + ":" +
       String(date.getMinutes()).padStart(2, "0");
    });

    const skelliesValues = labels.map(function(timestamp) {
        return skelliesMap[timestamp] ?? null;
    });

    const spawnersValues = labels.map(function(timestamp) {
        return spawnersMap[timestamp] ?? null;
    });

    const ctx = document.getElementById("priceChart");

    new Chart(ctx, {

        type: "line",

        data: {

            labels: formattedLabels,

            datasets: [

                {
                    label: "Skellies Price",
                    data: skelliesValues,
                    borderWidth: 3,
                    tension: 0.3,
                    pointRadius: 5
                },

                {
                    label: "Skeleton Spawners Price",
                    data: spawnersValues,
                    borderWidth: 3,
                    tension: 0.3,
                    pointRadius: 5
                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {
                    display: true
                },

                tooltip: {
                    callbacks: {
                        label: function(context) {

                            let value = context.parsed.y;

                            if (value >= 1000000000) {
                                return "Price: " + (value / 1000000000) + "b";
                            }

                            if (value >= 1000000) {
                                return "Price: " + (value / 1000000) + "m";
                            }

                            if (value >= 1000) {
                                return "Price: " + (value / 1000) + "k";
                            }

                            return "Price: " + value;
                        }
                    }
                }

            },

            scales: {

                x: {

                    ticks: {
                        color: "#888"
                    }

                },

                y: {

                    ticks: {

                        color: "#888",

                        callback: function(value) {

                            if (value >= 1000000000) {
                                return (value / 1000000000) + "b";
                            }

                            if (value >= 1000000) {
                                return (value / 1000000) + "m";
                            }

                            if (value >= 1000) {
                                return (value / 1000) + "k";
                            }

                            return value;
                        }

                    }

                }

            }

        }

    });

}


setInterval(function() {

    location.reload();

}, 10000);

</script>

</body>
</html>
